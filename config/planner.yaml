# Parameters of the step-1 simulation and DP planner.
# Units: mm and degrees unless stated. Every geometric value here that describes the
# real cell is a guess (status: estimated) and is a parameter, not a constant.
# Values measured on the cell live in config/cell.yaml; this file never overrides them.

toolpath:
  ds_mm: 1.5                 # waypoint spacing (task: densify to 1-2 mm, LIN/C_DIS blending is not modelled)
  patch_center_xy: [713, -410]   # centre of the bed outline in cell.yaml
  patch_half_size: 120       # test surfaces span 240 x 240 mm
  raster_spacing: 40         # distance between raster lines (sparse on purpose: this is a planner test, not infill)
  base_height: 10            # first non-planar layer sits this far above the bed top
  layer_index: 0             # which layer of the stack is planned (layer z = surface + index * layer height)
  max_tilt_deg: 30           # default nozzle tilt cap from vertical; RESULTS.md sweeps it
  tilt_sweep_deg: [0, 15, 30, 45, 60]
  perimeter_inset: 40        # perimeter test path, inset from the bed outline

planner:
  angle_bin_deg: 5           # redundancy-angle discretisation (72 bins over 360 deg)
  max_dbin: 3                # max change of redundancy bin between neighbouring points (15 deg per step)
  velocity_scale: 1.0        # fraction of URDF joint velocity used for the max joint step (URDF velocities unverified)
  min_abs_a5_deg: 0.0        # optional hard wrist-singularity limit; 0 = cost only
  weights:
    limit: 1.0               # joint-limit proximity
    singularity: 1.0         # wrist singularity (|A5| small)
    smooth: 1.0              # joint-space smoothness, (dq / dq_max)^2 summed over joints
  limit_soft_zone_deg: 30    # limit cost rises inside this distance to the (margin-reduced) limit
  a5_soft_zone_deg: 20       # singularity cost rises for |A5| below this

collision:
  bed_gap_mm: 5.0            # required clearance of every robot/tool primitive to the bed top
  tip_free_mm: 10.0          # last part of the nozzle that is allowed to be near the bed/print (not near clamps)
  tip_radius: 3.0            # that last part, checked against the clamps only
  clamp_inflate_mm: 20.0     # added to every clamp box (photo estimates are +-15-30 mm)
  clamp_half_xy: [30, 30]    # toggle clamp footprint half size (estimated)
  clamp_default_height: 72   # used when a clamp's height is unknown (the one measured clamp is 72 above the bed)
  minus_x_clamp_band: [380, 410]   # x band of the -X clamp pair; y unknown -> spans the whole bed edge
  check_floor: true          # nothing below the bed underside (table) except the robot base
  # Primitive robot model (capsules: segment + radius), radii estimated from the datasheet drawing.
  link_radius:
    link1: 110
    upper_arm: 75
    forearm: 65
    wrist: 60
  # Tool (extruder) primitives in the flange frame; the real tool geometry is unknown.
  # The tip is TOOL 3 = (225.55, -0.6, 72.83). The nozzle points along tool +X.
  tool:
    bracket_radius: 45       # flange -> barrel axis, along flange Z
    barrel_radius: 40        # barrel along tool X, from barrel_back_mm behind to nozzle start
    barrel_back_mm: 120      # hopper/feed side behind the flange axis (-X tool)
    nozzle_length: 40        # nozzle cone length before the tip
    nozzle_radius: 10

# Moves between printed segments in the KRL export (issue #2). Simulation parameters, not lab values.
transit:
  safe_height_mm: 30         # retract the tip to this height above the bed top before any transit.
                             # 30 mm: 20 mm above the 10 mm first non-planar layer, > 20x the 1.3-1.5 mm
                             # layer height, and enough for the 5 mm bed gap plus the 10 mm nozzle capsule.
                             # It is below the clamp tops (72 mm), so clamps are avoided by checking, not by height.
  min_retract_mm: 5          # always lift at least this much above the higher of the two segment ends
  via_heights_mm: [80, 120, 180]   # fallback transit heights above the bed top, tried in order when the
                             # PTP at the safe height collides (vertical LIN up, PTP, vertical LIN down)
  bed_clearance_mm: 15       # flag any transit sample where a robot/tool primitive (tip included) is closer
                             # to the bed than this (retract / approach LINs are exempt: they start at the print)
  vel_axis_pct: 5            # $VEL_AXIS[1..6] in the export, percent of each axis' maximum speed
  acc_axis_pct: 10           # $ACC_AXIS[1..6] in the export, percent
  max_tcp_speed_mm_s: 100    # TCP speed rule for transits (mm/s)
  speed_safety_factor: 0.8   # k: before each transit PTP, $VEL_AXIS is lowered so that the model peak TCP speed is
                             # <= k * max_tcp_speed_mm_s (k < 1 because the URDF axis maxima are unverified)
  allow_fast_transit: false  # false: a transit still above k * max_tcp_speed_mm_s at $VEL_AXIS = 1 % raises
                             # TransitError; true: it is exported and flagged
  axis_acc_deg_s2: [1000, 1000, 1000, 1000, 1000, 1000]   # ASSUMED axis accelerations at $ACC_AXIS = 100 %
                             # (not in the datasheet, not measured). Only used to cap the speed estimate of moves
                             # too short to reach cruise; a higher value gives a higher (more conservative) estimate.
  printed_clearance_mm: 15   # transit height >= highest Z printed so far + this (material already on the bed)
  max_wrist_turn_deg: 180    # flag a transit that turns A4 or A6 by more than this (hose / cable wrap not modelled)
  ptp_sample_deg: 0.5        # PTP collision sampling: max joint change between samples
  lin_sample_mm: 1.0         # LIN collision sampling: max TCP step between samples
  lin_max_joint_step_deg: 3.0   # a LIN whose IK jumps more than this between samples is not continuous
  before_vel_axis_pct: 100   # controller default assumed for the old unbounded PTP (for the before numbers)
  # First PTP of every generated program (kukasim/first_ptp.py): it starts from the pose the robot is in.
  # If no integer $VEL_AXIS >= 1 % bounds its TCP speed from ANY start to <= k * max_tcp_speed_mm_s
  # (bound: sum_i $VEL_AXIS % x URDF axis max speed x axis-to-tip radius r_i), the programs declare this
  # start pose instead and the header requires the robot to be there before the program starts.
  start_axis: [0, -90, 90, 0, 0, 0]   # A1..A6 (deg). DEFAULT = KUKA's usual HOME ($H_POS {A1 0, A2 -90, A3 90,
                             # A4 0, A5 0, A6 0}), the pose of test_home_pose_flange; the cell's own home / start
                             # pose is not known (not read from the controller): replace it before any run
  start_tolerance_deg: 1.0   # the robot must be within this of start_axis on every axis; the first-PTP speed is
                             # evaluated from a SAMPLE of starts in this tolerance box (the 3^6 grid at -tol, 0,
                             # +tol plus 256 random interior points, fixed seed; kukasim/first_ptp.py), not a bound
  start_sample_margin: 0.1   # the worst sampled peak must be <= (1 - margin) x k x max_tcp_speed_mm_s
                             # (0.9 x 80 = 72 mm/s), a reserve for starts between the samples

# Corner test (kukasim/hilbert_corner.py, scripts/run_hilbert_corner.py): one planar Hilbert
# curve, fixed extruder rpm, a different speed-override ratio at every corner.
# Every value here is a choice or an assumption, not a measurement of the cell.
hilbert_corner:
  order: 3                   # Hilbert order n: 4^n vertices on a 2^n x 2^n grid
  side_mm: null              # null: largest square (rounded down to 10 mm) that fits the reachable bed
                             # with fit_margin_mm and clamp_margin_mm, at most max_side_mm
  max_side_mm: 300           # cap of the fitted side (a smaller square away from the clamps)
  clamp_margin_mm: 60        # fitted square >= this far (XY) from every inflated clamp box in cell.yaml (checked)
  center_xy: null            # null: centre of that square; set both side_mm and center_xy to place it by hand
  fit_margin_mm: 20          # margin of the fitted square to unreachable / colliding / off-bed points
  fit_grid_mm: 5             # resolution of the reachability map used for the fit
  bed_edge_margin_mm: 20     # nozzle tip at least this far inside the bed outline (check)
  theta_deg: 0.0             # rotation about the vertical nozzle; 0 = A0 B90 C0 of the planar programs
  approach_lift_mm: 20       # start / end the layer with a vertical LIN from this height
  approach_vel_axis_pct: 5   # $VEL_AXIS[1..6] for the approach PTP (same default as the KRL export transits)
  approach_acc_axis_pct: 10  # $ACC_AXIS[1..6] for the approach PTP
  layer_z:                   # z(x, y) = z0 + kx (x - x0) + ky (y - y0); default flat
    z0: null                 # null: bed top_z + process layer height (cell.yaml)
    kx: 0.0                  # slope along X (mm / mm)
    ky: 0.0                  # slope along Y (mm / mm)
    x0: null                 # null: centre of the square
    y0: null
  speed_mode: krl            # krl (default): the program splits each leg at +-d_zone_mm around every corner and
                             # sets $VEL.CP = r x v on the corner sub-segments (path-synchronous, no PC needed).
                             # pc: $OV_PRO switched per schedule.csv by a PC-side schedule follower, which this
                             # repository does NOT provide (window_* and pc_latency_s apply only to this mode)
  d_zone_mm: 6               # krl mode: corner zone half-length; must be >= 2 x c_dis_mm
  ratios: [0.5, 0.7, 0.85, 1.0, 1.15, 1.3, 1.5]   # r = corner override / straight override
  min_repeats: 2             # every ratio is used at least this often
  seed: 1                    # seeded random order of the ratios over the corners
  straight_speed_mm_s: null  # null: process.print_speed_mm_s from cell.yaml
  straight_override_pct: 60  # pc mode: $OV_PRO on straights; r_max * 60 = 90 % stays <= 100 %
  window_before_mm: 10       # pc mode: PC switches to the corner override this far before the corner vertex
  window_after_mm: 5         # pc mode: ... and back to the straight override this far after it
  min_straight_mm: 15        # (between corner zones) ASSUMPTION: extruder flow responds in a few tenths of a second; at ~12 mm/s
                             # 0.3 s is ~4 mm, so 15 mm (~4 time constants) between override windows keeps one
                             # corner's transient out of the next. Corners with a shorter straight get r = 1.
  # Corner-speed model (model estimate only; compare with the speed logged by the controller)
  c_dis_mm: 3.0              # $APO.CDIS used in the export; KRC caps it at half the shorter adjacent segment
  path_acc_mm_s2: 500        # ASSUMED path acceleration for override changes (trapezoid); not read from the KRC
  lateral_acc_mm_s2: 500     # ASSUMED lateral acceleration limit in the blend arc (v <= sqrt(a R_min))
  pc_latency_s: 0.10         # pc mode: ASSUMED delay from the PC's position read to the new override taking effect
  corner_dip_factor: 1.0     # commanded speed inside each blend x this (1.0 = no dip, the old model). Blended
                             # 90 deg corners dip below line speed on real controllers; the logged speed decides
  # Check thresholds
  max_tcp_speed_mm_s: 100    # flag any commanded TCP speed above this
  min_abs_a5_deg: 10         # wrist singularity
  min_elbow_deg: 10          # |A3 - stretched-arm angle|
  min_shoulder_mm: 150       # wrist centre distance to the A1 axis
  min_nozzle_bed_mm: 0.5     # nozzle tip above the highest bed point
  bed_top_max_z: 1.38        # highest measured bed top (cell.yaml comment: 1.38 at the +X/+Y corner, cloth tape)
  ds_mm: 1.0                 # sampling of the blended path for the checks and the speed profile
  min_lin_mm: 0.5            # guard: every LIN of the export must be longer than this

# Static check of a KRL program against this cell model (kukasim/src_check.py, scripts/check_src.py).
# Defaults are copied from the transit and hilbert_corner sections above (noted per value); the
# checker reads only this section, so changing a value here does not change the exporters.
src_check:
  lin_sample_mm: 1.0         # = transit.lin_sample_mm: max TCP step between LIN samples
  lin_sample_deg: 1.0        # NEW (no counterpart): max orientation step between LIN samples; transit LINs
                             # hold the orientation, a program's LINs may turn the nozzle by 15 deg in 1.5 mm
  ptp_sample_deg: 0.5        # = transit.ptp_sample_deg: max joint change between PTP samples
  lin_ori_ambiguous_deg: 1.0 # NEW: a #VAR LIN turning the tool by more than 180 - this is not path-checked
                             # (no unique shortest rotation; the sampled path would depend on rounding)
  lin_max_joint_step_deg: 3.0   # = transit.lin_max_joint_step_deg: a LIN whose IK jumps more than this
                             # between samples is not continuous (configuration change)
  min_abs_a5_deg: 10         # = hilbert_corner.min_abs_a5_deg (wrist singularity)
  min_elbow_deg: 10          # = hilbert_corner.min_elbow_deg (|A3 - stretched-arm angle|)
  min_shoulder_mm: 150       # = hilbert_corner.min_shoulder_mm (wrist-centre distance to the A1 axis)
  max_tcp_speed_mm_s: 100    # = transit / hilbert_corner max_tcp_speed_mm_s (M1). Flag above this.
                             # No safety factor here: the exporters enforce 0.8 x this on their transits.
  min_clearance_mm: 0.0      # flag a signed CollisionModel clearance below this (M2); the bed gap (5 mm),
                             # the clamp inflation (20 mm) and each keep-out's clearance_mm are already inside
                             # the margin, as in transit (a transit with clearance < 0 is flagged)
  min_nozzle_bed_mm: 0.5     # = hilbert_corner.min_nozzle_bed_mm (M3): tip Z above the highest bed point
  bed_top_max_z: 1.38        # = hilbert_corner.bed_top_max_z (highest measured bed top, cell.yaml comment)
  bed_edge_margin_mm: 20     # = hilbert_corner.bed_edge_margin_mm: LIN tip XY inside the bed outline minus this
  unset_vel_axis_pct: 100    # $VEL_AXIS assumed where the program has not set it (= transit.before_vel_axis_pct)
  unset_acc_axis_pct: 100    # $ACC_AXIS assumed where not set (= the 100 % used for the 'before' PTP in krl.py)
  assumed_ref_axis_deg: [0, -90, 90, 0, 0, 0]   # when nothing fixes the configuration of the first Cartesian
                             # target (no S / T, no preceding axis PTP), the IK solution closest to this is assumed
                             # and the report says so
