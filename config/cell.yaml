# Print cell of the KUKA KR 10 R1100-2 (KR C4, KSS 8.3), as far as it is known.
# Units: mm and degrees unless stated. Frames: BASE 0 = robot base frame; TOOL 3 = nozzle tip.
# status: measured | copied (from a controller file) | estimated | unknown

robot:
  model: KR 10 R1100-2
  urdf: robot/kr10_r1100_2/urdf/kr10_r1100_2.urdf   # exported with SW2URDF; meshes are not in this repo
  status: copied
  check: "FK of this URDF + TOOL 3 reproduced one logged home pose to 0.05 mm / 0.04 deg; only one pose checked"

tool:                     # TOOL_DATA[3] from the controller's $config.dat (copy of 2026-05-12)
  x: 225.55
  y: -0.6
  z: 72.83
  a: 0.0
  b: 0.0
  c: 0.0
  status: copied          # to be re-confirmed on the pendant

base: {x: 0, y: 0, z: 0, a: 0, b: 0, c: 0}   # BASE 0

datasheet:                # KUKA datasheet 0000-290-003 V7.1 (07.03.2024), checked 2026-10-31
  reach_mm: 1101
  payload_rated_kg: 10
  payload_max_kg: 11.1
  robot_mass_kg: 55
  axis_ranges_match_urdf: true
  axis_speeds: "not in this datasheet; URDF velocities (300/225/330/360/360/433 deg/s) are unverified"

tool_load:                # LOAD_DATA[3] on the controller is a placeholder (10 kg, CM 0); real values unknown
  mass_kg: null
  com_mm: null
  status: unknown

joint_limits_deg:         # from the URDF (= datasheet ranges); the controller's software limits are unknown
  status: unknown         # $SOFTN_END / $SOFTP_END still to be read from $machine.dat
  use_margin_deg: 2.0
  a1: [-170, 170]
  a2: [-190, 45]
  a3: [-120, 156]
  a4: [-185, 185]
  a5: [-120, 120]
  a6: [-350, 350]

bed:                      # bare MDF board; print surface
  # Current bed (in use since after May 2026): a CNC-cut 2 ft x 2 ft MDF board on a dark underlay sheet.
  top_z: 0.95             # measured 2026-10-13 at (880, -520); 1.38 at the +X/+Y corner over cloth tape
  top_z_status: measured
  corner_plus_x_plus_y: [1018.01, -105.87] # jogged 2026-10-06 ($POS_ACT, TOOL 3, BASE 0)
  corner_status: measured
  edge_lengths_from_corner: {to_plus_x_minus_y: 608, to_minus_x_plus_y: 610}   # measured 2026-10-06
  outline_xy: {x: [408.0, 1018.0], y: [-713.9, -105.9]}   # derived, assuming edges along the base axes
  outline_status: derived
  rotation_about_z_deg: null               # not measured; a second jogged corner (-X/+Y) would give it
  thickness: 13.55                         # derived (consistent with 1/2 in MDF), not measured
  note: "The +X/-Y corner is outside the robot's workspace (not reachable by jog)."

obstacles:                                 # toggle clamps holding the bed; positions are photo estimates (+-15-30 mm)
  - name: clamp_plus_x_plus_y
    pad_xy: [990, -168]
    top_above_bed: 72                      # measured 2026-10-17
    distance_to_plus_y_edge: 32            # measured 2026-10-17
    distance_to_plus_x_edge: 28.7          # measured 2026-10-17
    status: estimated
  - name: clamp_plus_x_minus_y
    pad_xy: [981, -670]
    status: estimated
  - name: clamps_minus_x_pair
    x: 395                                 # just outside the -X edge; pads at x ~420; their y is not known
    status: estimated
  # hopper, hose, cables, camera cage: unknown, to be added

process:
  print_speed_mm_s: 12
  nozzle_diameter_mm: 3
  layer_height_mm: [1.3, 1.5]              # 1.3 in current prints, 1.5 slicer default
  planar_orientation_abc: [0, 90, 0]       # A0 B90 C0 in the current planar programs
  logged_orientation_example_abc: [84.1, 89.9, 116.2]   # a logged pose near B = 90 (Euler singularity)

slicer:
  repo: https://github.com/yem-hjk6th/non_planar_slicer   # GPL-3.0: keep this repo's code a separate module
  krl_orientation: "A = atan2(...) + 180, B = 90 - tilt, C = 0"
